<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Los Arcos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Raleway:wght@300;400;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <nav class="nav-principal">
    <div class="nav-bloque">
      <a href="index.html">Inicio</a>
      <a href="eventos.html">Eventos</a>
      <a href="alojamiento.html">Alojamiento</a>
    </div>
    <div class="logo-central">
      <h1>LOS ARCOS</h1>
      <div class="sub-logo"><span>FINCA</span></div>
    </div>
    <div class="nav-bloque">
      <a href="lugar.html">Entorno</a>
      <a href="galeria.html">Galería</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>

  <section class="seccion-contacto-foto">
    <h2 class="titulo-pagina" data-aos="fade-up" style="color: white; margin-top: 0;">Contacto</h2>

    <div class="contacto-container">
      <div class="contacto-info" data-aos="fade-right" data-aos-delay="200">
        <h2 style="color: var(--primario); margin-bottom: 20px; font-size: 2.8rem;">Hablemos</h2>
        <p style="font-size: 1.3rem;">¿Quieres reservar una fecha? Ayudamos a organizar tu evento ideal.</p>
        <br>
        <p style="font-size: 1.4rem;"><strong>📞 +34 685 15 27 30</strong></p>
        <p style="font-size: 1.4rem;"><strong>✉️ villalosarcos@gmail.com</strong></p>
      </div>

      <form id="my-form" action="https://formspree.io/f/xvzdqwdk" method="POST" class="contacto-form"
        data-aos="fade-left" data-aos-delay="400">
        <input type="text" name="Nombre" class="form-control" placeholder="Nombre" required>
        <input type="email" name="Email" class="form-control" placeholder="Email" required>
        <textarea name="Mensaje" class="form-control" rows="4" placeholder="Tu mensaje" required></textarea>
        <button id="my-form-button" type="submit" class="btn" style="width: 100%;">Enviar Mensaje</button>
        <p id="my-form-status" style="margin-top:15px; text-align: center; color: var(--primario); font-weight: 600;">
        </p>
      </form>
    </div>
  </section>

  <footer class="footer-premium">
    <div class="footer-content">
      <div class="footer-logo-contenedor">
        <a href="index.html">
          <img src="Imagenes/arcos_logo.png" alt="Logo Los Arcos" class="logo-footer-img">
          <h2 class="footer-logo-texto">LOS ARCOS</h2>
        </a>
      </div>
      <div class="footer-copyright">
        <p>&copy; 2026 Finca Los Arcos. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <div class="redes-flotantes-container">
    <div class="redes-lista" id="menu-redes">
      <a href="https://wa.me/34685152730?text=Hola!%20Me%20gustaría%20pedir%20información%20sobre%20la%20finca."
        target="_blank" class="icono-red" title="WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
      </a>
      <a href="https://instagram.com/tufinca" target="_blank" class="icono-red" title="Instagram">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
      </a>
    </div>
    <button class="btn-flotante-main" id="btn-toggle-redes" style="font-family: Arial, sans-serif;">
      <span id="icono-abrir" style="font-size: 32px; font-weight: 300; transition: all 0.3s;">+</span>
    </button>
  </div>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    // Inicializar Animaciones
    AOS.init({
      duration: 1000,
      once: true,
      offset: 100
    });

    // Lógica Formspree (Envío de formulario)
    var form = document.getElementById("my-form");
    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("my-form-status");
      var data = new FormData(event.target);
      var button = document.getElementById("my-form-button");
      button.innerText = "Enviando...";
      button.disabled = true;

      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          window.location.href = "gracias.html";
        } else {
          status.innerHTML = "Hubo un problema. Inténtalo de nuevo.";
        }
      }).catch(error => {
        status.innerHTML = "Error de conexión. Revisa tu internet.";
      }).finally(() => {
        button.innerText = "Enviar Mensaje";
        button.disabled = false;
      });
    }
    form.addEventListener("submit", handleSubmit);

    // Lógica Menú de Redes Flotantes
    const btnRedes = document.getElementById('btn-toggle-redes');
    const menuRedes = document.getElementById('menu-redes');
    const iconoAbrir = document.getElementById('icono-abrir');

    btnRedes.addEventListener('click', () => {
      menuRedes.classList.toggle('mostrar-redes');
      if (menuRedes.classList.contains('mostrar-redes')) {
        iconoAbrir.innerHTML = '✕';
        iconoAbrir.style.fontSize = '24px';
      } else {
        iconoAbrir.innerHTML = '+';
        iconoAbrir.style.fontSize = '32px';
      }
    });
  </script>
</body>

</html>
