<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Los Arcos</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="nav-principal">
    <div class="nav-bloque">
      <a href="index.html">Inicio</a>
      <a href="eventos.html">Eventos</a>
      <a href="alojamiento.html">Alojamiento</a>
    </div>
    <div class="logo-central">
      <h1>LOS ARCOS</h1>
      <div class="sub-logo"><span>FINCA</span></div>
    </div>
    <div class="nav-bloque">
      <a href="lugar.html">Entorno</a>
      <a href="galeria.html">Galería</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>

  <section class="seccion-contacto-foto">
    <h2 class="titulo-pagina animar" style="color: white; margin-top: 0;">Contacto</h2>
    <div class="contacto-container animar">
      <div class="contacto-info">
        <h2 style="color: var(--primario); margin-bottom: 20px;">Hablemos</h2>
        <p>¿Quieres reservar una fecha? Ayudamos a organizar tu evento ideal.</p>
        <br>
        <p><strong>📞 +34 000 000 000</strong></p>
        <p><strong>✉️ info@losarcosfinca.com</strong></p>
      </div>
      <form id="my-form" action="https://formspree.io/f/meepjpbe" method="POST">
        <input type="text" name="Nombre" class="form-control" placeholder="Nombre" required>
        <input type="email" name="Email" class="form-control" placeholder="Email" required>
        <textarea name="Mensaje" class="form-control" rows="4" placeholder="Tu mensaje" required></textarea>
        <button id="my-form-button" type="submit" class="btn" style="width: 100%;">Enviar Mensaje</button>
        <p id="my-form-status" style="margin-top:15px;"></p>
      </form>
    </div>
  </section>

  <footer class="footer-premium">
    <img src="Imagenes/arcos_logo.png" alt="Logo" class="logo-footer-img">
    <p>&copy; 2026 Finca Los Arcos. Todos los derechos reservados.</p>
  </footer>

  <script>
    var form = document.getElementById("my-form");
    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("my-form-status");
      var data = new FormData(event.target);
      var button = document.getElementById("my-form-button");
      button.innerText = "Enviando...";
      button.disabled = true;
      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) { window.location.href = "gracias.html"; }
        else { status.innerHTML = "Error al enviar"; }
      }).catch(error => { status.innerHTML = "Error de conexión"; })
        .finally(() => { button.innerText = "Enviar Mensaje"; button.disabled = false; });
    }
    form.addEventListener("submit", handleSubmit)
  </script>
</body>
 
</html>
