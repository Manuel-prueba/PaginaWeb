<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | La Finca</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Estilos específicos para darle vida a esta página */
    .seccion-contacto-foto {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('Imagenes/Patio_para_fondo.jpeg'); /* FOTO DE FONDO */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 80px 5%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contacto-container {
      background: rgba(255, 255, 255, 0.9); /* Blanco semitransparente */
      backdrop-filter: blur(10px); /* Desenfoque del fondo (efecto cristal) */
      border: 1px solid rgba(255, 255, 255, 0.3);
      max-width: 900px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 60px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .titulo-contacto-blanco {
      color: white !important;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
      margin-bottom: 40px;
    }

    .contacto-info h2, .contacto-info p {
      color: var(--primario);
    }

    @media (max-width: 768px) {
      .contacto-container {
        grid-template-columns: 1fr;
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <header class="header-interno header-contacto">
    <nav class="nav-principal">
      <div class="nav-bloque">
        <a href="index.html">Inicio</a>
        <a href="eventos.html">Eventos</a>
        <a href="alojamiento.html">Alojamiento</a>
      </div>
      <div class="logo-central">
        <h1>LOS ARCOS</h1>
        <div class="sub-logo"><span>FINCA</span></div>
      </div>
      <div class="nav-bloque">
        <a href="lugar.html">Entorno</a>
        <a href="galeria.html">Galería</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </nav>
  </header>

  <section class="seccion-contacto-foto">
    <h2 class="titulo-pagina animar titulo-contacto-blanco">Contacto</h2>
    
    <div class="contacto-container animar">
      <div class="contacto-info">
        <h2>Hablemos</h2>
        <p>¿Tienes alguna duda o quieres reservar una fecha? Estamos encantados de ayudarte a organizar tu evento ideal.</p>
        <br>
        <p><strong>Teléfono:</strong><br>📞 +34 000 000 000</p>
        <br>
        <p><strong>Email:</strong><br>✉️ info@losarcosfinca.com</p>
      </div>

      <form id="my-form" action="https://formspree.io/f/meepjpbe" method="POST" class="contacto-form">
        <input type="text" name="Nombre" class="form-control" placeholder="Nombre" style="margin-bottom:15px" required>
        <input type="email" name="Email" class="form-control" placeholder="Email" style="margin-bottom:15px" required>
        <textarea name="Mensaje" class="form-control" rows="4" placeholder="Tu mensaje" required></textarea>
        <br>
        <button id="my-form-button" type="submit" class="btn" style="width: 100%;">Enviar Mensaje</button>
        <p id="my-form-status" style="margin-top: 10px; font-weight: bold;"></p>
      </form>
    </div>
  </section>

  <script>
    var form = document.getElementById("my-form");

    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("my-form-status");
      var data = new FormData(event.target);
      var button = document.getElementById("my-form-button");
      button.innerText = "Enviando...";
      button.disabled = true;

      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          window.location.href = "gracias.html";
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
            } else {
              status.innerHTML = "¡Ups! Hubo un problema al enviar el formulario";
            }
          })
        }
      }).catch(error => {
        status.innerHTML = "¡Ups! Hubo un problema de conexión";
      }).finally(() => {
        button.innerText = "Enviar Mensaje";
        button.disabled = false;
      });
    }

    form.addEventListener("submit", handleSubmit)
  </script>
</body>

</html>
