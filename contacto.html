<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto | La Finca</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header-interno header-contacto">
        <nav class="nav-principal">
            <div class="nav-bloque">
                <a href="index.html">Inicio</a>
                <a href="informacion.html">Información</a>
            </div>
            <div class="logo-central">
                <h1>LOS ARCOS</h1>
                <div class="sub-logo"><span>FINCA</span></div>
            </div>
            <div class="nav-bloque">
                <a href="galeria.html">Galería</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
        <h2 class="titulo-pagina animar">Contacto</h2>
    </header>

    <section>
        <div class="contacto-container animar">
            <div class="contacto-info">
                <h2>Hablemos</h2>
                <p>📞 +34 000 000 000</p>
                <p>✉️ info@losarcosfinca.com</p>
            </div>

            <form class="contacto-form">
                <input type="text" class="form-control" placeholder="Nombre" style="margin-bottom:15px">
                <input type="email" class="form-control" placeholder="Email" style="margin-bottom:15px">
                <textarea class="form-control" rows="4" placeholder="Tu mensaje"></textarea>
                <br>
                <button type="button" class="btn" style="width: 100%;">Enviar</button>
            </form>
        </div>
    </section>

</body>
</html>
