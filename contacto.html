<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto | La Finca</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header-interno header-contacto">
        <nav class="nav-principal">
            <div class="nav-bloque">
                <a href="index.html">Inicio</a>
                <a href="eventos.html">Eventos</a>
                <a href="alojamiento.html">Alojamiento</a>
            </div>
            <div class="logo-central">
                <h1>LOS ARCOS</h1>
                <div class="sub-logo"><span>FINCA</span></div>
            </div>
            <div class="nav-bloque">
                <a href="lugar.html">Entorno</a>
                <a href="galeria.html">Galería</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </header>

    <section>
        <h2 class="titulo-pagina animar">Contacto</h2>
        <div class="contacto-container animar">
            <div class="contacto-info">
                <h2>Hablemos</h2>
                <p>📞 +34 000 000 000</p>
                <p>✉️ info@losarcosfinca.com</p>
            </div>

            <form id="my-form" action="https://formspree.io/f/meepjpbe" method="POST" class="contacto-form">

                <input type="text" name="Nombre" class="form-control" placeholder="Nombre" style="margin-bottom:15px"
                    required>

                <input type="email" name="Email" class="form-control" placeholder="Email" style="margin-bottom:15px"
                    required>

                <textarea name="Mensaje" class="form-control" rows="4" placeholder="Tu mensaje" required></textarea>

                <br>

                <button id="my-form-button" type="submit" class="btn" style="width: 100%;">Enviar</button>

                <p id="my-form-status" style="margin-top: 10px; font-weight: bold;"></p>

            </form>

            </form>
        </div>
    </section>

    <script>
    var form = document.getElementById("my-form");
    
    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("my-form-status");
      var data = new FormData(event.target);
      
      // Cambiamos el texto del botón para que el usuario vea que está pasando algo
      var button = document.getElementById("my-form-button");
      button.innerText = "Enviando...";
      button.disabled = true;

      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          // ¡ESTA ES LA MAGIA! Si todo va bien, saltamos a tu página
          window.location.href = "gracias.html";
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
            } else {
              status.innerHTML = "¡Ups! Hubo un problema al enviar el formulario";
            }
          })
        }
      }).catch(error => {
        status.innerHTML = "¡Ups! Hubo un problema de conexión";
      }).finally(() => {
        button.innerText = "Enviar";
        button.disabled = false;
      });
    }
    
    form.addEventListener("submit", handleSubmit)
</script>
</body>

</html>
