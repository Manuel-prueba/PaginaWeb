    <header class="header-interno header-contacto">
        <nav class="nav-principal">

        <div class="contacto-container animar">

                <h2>Hablemos</h2>
                <p>📞 +34 000 000 000</p>
                <p>✉️ info@losarcosfinca.com</p>
            </div>

            <form action="https://formspree.io/f/meepjpbe" method="POST" class="contacto-form">

                <input type="hidden" name="_next" value="https://manuel-prueba.github.io/PaginaWeb/gracias.html">
                
                <input type="text" name="Nombre" class="form-control" placeholder="Nombre" style="margin-bottom:15px" required>
                
                <input type="email" name="Email" class="form-control" placeholder="Email" style="margin-bottom:15px" required>
                
                <textarea name="Mensaje" class="form-control" rows="4" placeholder="Tu mensaje" required></textarea>
                
                <br>
                
                <button type="submit" class="btn" style="width: 100%;">Enviar</button>
                
            </form>
        </div>
    </section>
