<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Los Arcos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header-interno header-galeria-foto">
        <nav class="nav-principal">
            <div class="nav-bloque">
                <a href="index.html">Inicio</a>
                <a href="eventos.html">Eventos</a>
                <a href="alojamiento.html">Alojamiento</a>
            </div>
            <div class="logo-central">
                <h1>LOS ARCOS</h1>
                <div class="sub-logo"><span>FINCA</span></div>
            </div>
            <div class="nav-bloque">
                <a href="lugar.html">Entorno</a>
                <a href="galeria.html">Galería</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="seccion-mural">
        <h2 class="titulo-pagina animar">Nuestra Finca</h2>
        
        <div class="grid-mural animar">
            <div class="marco-foto">
                <img src="Imagenes/Atico.jpeg" alt="Ático de la finca">
                <div class="overlay-foto"><span>Ampliar</span></div>
            </div>
            <div class="marco-foto">
                <img src="Imagenes/Salon_con_vista.jpeg" alt="Salón con vistas">
                <div class="overlay-foto"><span>Ampliar</span></div>
            </div>
            <div class="marco-foto">
                <img src="Imagenes/Billar.jpeg" alt="Zona de juegos">
                <div class="overlay-foto"><span>Ampliar</span></div>
            </div>
            <div class="marco-foto">
                <img src="Imagenes/Patio_para_fondo.jpeg" alt="Patio exterior">
                <div class="overlay-foto"><span>Ampliar</span></div>
            </div>
            </div>
    </main>

    <div id="modal-galeria" class="modal">
        <span class="cerrar-modal">&times;</span>
        <img class="contenido-modal" id="img-ampliada">
        <div id="caption"></div>
    </div>

    <footer class="footer-premium">
        <div class="footer-content">
            <div class="footer-logo-contenedor">
                <img src="Imagenes/arcos_logo.png" alt="Logo Los Arcos" class="logo-footer-img">
            </div>
            <div class="footer-copyright">
                <p>&copy; 2026 Finca Los Arcos. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        const modal = document.getElementById("modal-galeria");
        const modalImg = document.getElementById("img-ampliada");
        const captionText = document.getElementById("caption");
        const fotos = document.querySelectorAll(".marco-foto");
        const span = document.getElementsByClassName("cerrar-modal")[0];

        fotos.forEach(foto => {
            foto.onclick = function(){
                const img = this.querySelector("img");
                modal.style.display = "flex";
                modalImg.src = img.src;
                captionText.innerHTML = img.alt;
            }
        });

        span.onclick = function() { 
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
