<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Los Arcos</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <nav class="nav-principal">
        <div class="nav-bloque">
            <a href="index.html">Inicio</a>
            <a href="eventos.html">Eventos</a>
            <a href="alojamiento.html">Alojamiento</a>
        </div>
        <div class="logo-central">
            <h1>LOS ARCOS</h1>
            <div class="sub-logo"><span>FINCA</span></div>
        </div>
        <div class="nav-bloque">
            <a href="lugar.html">Entorno</a>
            <a href="galeria.html">Galería</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </nav>

    <header class="header-interno header-galeria-foto">
        <h2 class="titulo-pagina animar" style="color: white;">Nuestra Finca</h2>
    </header>

    <main class="seccion-mural">
        <div class="grid-mural animar">
            <div class="marco-foto">
                <img src="Imagenes/Atico.jpeg" alt="Suite Ático"
                    data-description="Nuestra suite principal ofrece calidez y vistas privilegiadas. Un espacio diseñado con madera y piedra para un descanso total.">
                <div class="overlay-foto"><span>Ver detalle</span></div>
            </div>
            <div class="marco-foto">
                <img src="Imagenes/Salon_con_vista.jpeg" alt="Salón Principal"
                    data-description="Un salón acogedor con grandes ventanales. La luz de Granada inunda cada rincón, creando el ambiente perfecto para reuniones íntimas.">
                <div class="overlay-foto"><span>Ver detalle</span></div>
            </div>
            <div class="marco-foto">
                <img src="Imagenes/Billar.jpeg" alt="Zona de Ocio"
                    data-description="Diversión garantizada en nuestro salón de juegos. Equipado con billar, air hockey y una decoración rústica impecable.">
                <div class="overlay-foto"><span>Ver detalle</span></div>
            </div>
            <div class="marco-foto">
                <img src="Imagenes/Patio_para_fondo.jpeg" alt="Exteriores y Piscina"
                    data-description="Más de 400m² de jardín con piscina privada. El escenario idílico para barbacoas al aire libre y eventos bajo el sol granadino.">
                <div class="overlay-foto"><span>Ver detalle</span></div>
            </div>
        </div>
    </main>

    <div id="modal-galeria" class="modal">
        <span class="cerrar-modal">&times;</span>
        <div class="modal-card">
            <div class="modal-img-container">
                <img id="img-ampliada" src="" alt="">
            </div>
            <div class="modal-text-container">
                <h3 id="modal-titulo">Título</h3>
                <div class="divisor" style="width: 40px; height: 2px; background: var(--secundario); margin: 15px 0;">
                </div>
                <p id="modal-descripcion">Descripción...</p>
            </div>
        </div>
    </div>

    <footer class="footer-premium">
        <div class="footer-content">
            <img src="Imagenes/arcos_logo.png" alt="Logo" class="logo-footer-img">
            <p>&copy; 2026 Finca Los Arcos. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        const modal = document.getElementById("modal-galeria");
        const modalImg = document.getElementById("img-ampliada");
        const modalTit = document.getElementById("modal-titulo");
        const modalDesc = document.getElementById("modal-descripcion");
        const fotos = document.querySelectorAll(".marco-foto");
        const span = document.querySelector(".cerrar-modal");

        fotos.forEach(foto => {
            foto.onclick = function () {
                const img = this.querySelector("img");
                modal.style.display = "flex";
                modalImg.src = img.src;
                modalTit.innerHTML = img.alt;
                modalDesc.innerHTML = img.getAttribute("data-description");
            }
        });

        span.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }
    </script>
</body>

</html>
