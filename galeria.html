<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Galería | La Finca</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header-interno header-galeria-foto">
        <nav class="nav-principal">
            <div class="nav-bloque">
                <a href="index.html">Inicio</a>
                <a href="eventos.html">Eventos</a>
                <a href="alojamiento.html">Alojamiento</a>
            </div>
            <div class="logo-central">
                <h1>LOS ARCOS</h1>
                <div class="sub-logo"><span>FINCA</span></div>
            </div>
            <div class="nav-bloque">
                <a href="lugar.html">Entorno</a>
                <a href="galeria.html">Galería</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="seccion-mural">
        <h2 class="titulo-pagina animar">Galería</h2>
        <div class="grid-mural" style="padding: 40px 10%;">
            <div class="marco-foto animar">
                <img src="Imagenes/Atico.jpeg" alt="Ático">
                <div class="overlay-foto">Ampliar</div>
            </div>
            <div class="marco-foto animar">
                <img src="Imagenes/Salon_con_vista.jpeg" alt="Salón">
                <div class="overlay-foto">Ampliar</div>
            </div>
        </div>
    </main>

    <div id="modal-galeria" class="modal">
        <span class="cerrar-modal">&times;</span>
        <img class="contenido-modal" id="img-ampliada">
    </div>

    <script>
        const modal = document.getElementById("modal-galeria");
        const modalImg = document.getElementById("img-ampliada");
        const fotos = document.querySelectorAll(".marco-foto");

        fotos.forEach(foto => {
            foto.addEventListener("click", () => {
                const img = foto.querySelector("img");
                modal.style.display = "flex";
                modalImg.src = img.src;
            });
        });

        modal.onclick = () => modal.style.display = "none";
    </script>

</body>

</html>
